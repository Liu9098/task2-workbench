<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Task 2 检前告知">
  <meta name="mobile-web-app-capable" content="yes">
  <title>高职英语（三）涉外体检职场英语 — Task 2 检前告知工作站</title>
  <style>
:root{
  --primary:#4880c8; --primary-dark:#3a6dae; --primary-light:#eaf2fb;
  --teal:#0f9d8f; --teal-light:#e3f6f4;
  --amber:#e8890c; --amber-light:#fdf1e0;
  --danger:#d34c46; --danger-light:#fdeaea;
  --green:#2f9e44; --green-light:#e8f6e9;
  --purple:#6741d9; --purple-light:#eeecfb;
  --bg:#f1f4f8; --card:#ffffff;
  --text:#1b202b; --text-2:#55606f; --text-3:#748094;
  --border:#e6eaf0; --border-2:#d7dee8;
  --sidebar:#223959; --sidebar-2:#1b2f4b;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(16,32,56,.06),0 1px 2px rgba(16,32,56,.04);
  --shadow-md:0 4px 16px rgba(16,32,56,.10);
  --shadow-lg:0 12px 40px rgba(16,32,56,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  display:flex; min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:14px}

/* ===== 侧边栏 ===== */
.sidebar{
  width:252px; flex:0 0 252px; background:var(--sidebar); color:#fff;
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:20;
}
.sidebar-header{padding:20px 18px 6px}
.logo{display:flex; align-items:center; gap:12px}
.logo-icon{
  width:42px;height:42px;border-radius:11px;background:#76b1e8;
  display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 42px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
.logo-text{font-size:18px;font-weight:700;letter-spacing:.5px}
.logo-sub{font-size:11px;opacity:.65;margin-top:2px}
.course-name{
  margin-top:12px;font-size:13px;line-height:1.5;opacity:.78;
}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 0}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 18px;
  cursor:pointer;color:rgba(255,255,255,.82);transition:.15s;font-size:14px;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item .nav-ico{font-size:17px;width:20px;text-align:center}
.nav-item .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:9px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.95);color:var(--primary)}
.sidebar-footer{padding:16px 18px;border-top:1px solid rgba(255,255,255,.10);font-size:12px;opacity:.82}
.poa-tag{
  display:inline-block;background:rgba(118,177,232,.22);color:#9cc8f2;font-size:12px;
  padding:3px 10px;border-radius:8px;margin-bottom:8px;font-weight:600;letter-spacing:.3px;
}
.dim-text{opacity:.6;margin-top:5px}

/* ===== 主内容 ===== */
.main-content{flex:1;margin-left:252px;padding:0 0 60px;min-width:0}
.page-header{
  background:var(--bg);padding:22px 24px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:10;
}
.page-header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.page-sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.page-sub:empty{display:none}
.header-actions{display:flex;gap:10px}
#page-content{padding:14px 24px 40px}

/* ===== 课程总览（默认首页） ===== */
.ov-banner{
  display:flex;align-items:center;gap:10px;background:#eef8fd;border:1px solid #d9edf9;
  border-radius:12px;padding:14px 20px;margin-bottom:18px;font-size:14px;color:#33414f;
}
.ov-banner-ico{font-size:15px}
.ov-banner-txt{flex:1;line-height:1.5}
.ov-banner-txt b{color:var(--primary);font-weight:700}
.ov-banner-btn{
  border:none;background:var(--primary);color:#fff;font-size:13.5px;font-weight:600;
  padding:8px 20px;border-radius:8px;cursor:pointer;transition:.15s;
}
.ov-banner-btn:hover{background:var(--primary-dark)}

.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.ov-stat{
  background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);
}
.ov-stat-label{font-size:13px;color:var(--text-3)}
.ov-stat-value{font-size:30px;font-weight:700;color:var(--text);line-height:1.15;margin:8px 0 6px}
.ov-stat-value span{font-size:13px;font-weight:400;color:var(--text-2);margin-left:5px}
.ov-stat-hint{font-size:12.5px;color:var(--text-3)}

.ov-board{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 22px 4px;box-shadow:var(--shadow)}
.ov-board-head{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:16px}
.ov-task{
  position:relative;background:#fff;border:1px solid var(--border);border-top:4px solid var(--primary);
  border-radius:12px;padding:16px 18px 14px;cursor:pointer;overflow:hidden;
  transition:box-shadow .16s,transform .16s;
}
.ov-task:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ov-task-num{position:absolute;top:8px;right:16px;font-size:42px;font-weight:800;line-height:1;opacity:.17}
.ov-task-head{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.ov-task-ico{font-size:18px}
.ov-task-name{font-size:16px;font-weight:700;color:var(--text)}
.ov-task-pill{
  display:inline-block;margin:10px 0 13px;background:#e9eef4;color:#42506a;
  font-size:12px;padding:3px 11px;border-radius:7px;
}
.ov-bar{height:10px;border-radius:6px;background:#e9eef4;overflow:hidden}
.ov-bar i{display:block;height:100%;border-radius:6px;transition:width .4s ease}
.ov-task-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:11px;font-size:12.5px;color:var(--text-3)}
.ov-task-foot .ov-done i{font-style:normal;margin-right:3px}
.ov-task-foot .ov-wait{color:#d34c46}
@media(max-width:1240px){
  .ov-stats{grid-template-columns:repeat(2,1fr)}
  .ov-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .ov-stats{grid-template-columns:1fr}
  .ov-grid{grid-template-columns:1fr}
}

/* ===== 通用组件 ===== */
.btn{
  border:1px solid var(--border-2);background:#fff;color:var(--text);
  padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:.15s;font-size:13.5px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-teal:hover{background:#0b867a;border-color:#0b867a;color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#bf3535;border-color:#bf3535;color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-lg{padding:11px 20px;font-size:14.5px}
.btn-outline{background:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;
}
.card-title{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-desc{font-size:12.5px;color:var(--text-3);margin-bottom:14px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.tag{
  display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:10px;
  background:var(--primary-light);color:var(--primary);margin:0 6px 6px 0;
}
.tag-teal{background:var(--teal-light);color:var(--teal)}
.tag-amber{background:var(--amber-light);color:var(--amber)}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-danger{background:var(--danger-light);color:var(--danger)}
.tag-purple{background:var(--purple-light);color:var(--purple)}
.tag-gray{background:#eef1f5;color:var(--text-2)}

.stat-row{display:flex;gap:16px;flex-wrap:wrap}
.stat{
  flex:1;min-width:130px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat-label{font-size:12px;color:var(--text-3)}
.stat-value{font-size:24px;font-weight:600;margin-top:2px;line-height:1.2}
.stat-unit{font-size:12px;color:var(--text-3);font-weight:400;margin-left:3px}
.stat-hint{font-size:11.5px;color:var(--text-3);margin-top:2px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  background:#f7f9fc;text-align:left;padding:10px 12px;font-weight:600;
  border-bottom:1px solid var(--border);color:var(--text-2);white-space:nowrap;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:hover td{background:#fafbfe}
.tbl-wrap{overflow-x:auto}

.bar-track{height:8px;background:#eef1f5;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--primary)}

.empty{
  text-align:center;padding:40px 20px;color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--border-2);border-radius:var(--radius);background:#fbfcfe;
}
.empty .empty-ico{font-size:30px;display:block;margin-bottom:8px;opacity:.5}

.toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:rgba(23,34,50,.94);color:#fff;padding:9px 18px;border-radius:20px;
  font-size:13px;box-shadow:var(--shadow-md);animation:toastIn .22s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== 弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,26,42,.55);z-index:3000;
  display:none;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:680px;box-shadow:var(--shadow-lg);
  animation:modalIn .2s ease;
}
.modal.modal-lg{max-width:980px}
.modal.modal-xl{max-width:1180px}
@keyframes modalIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.modal-header{
  padding:16px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{
  border:none;background:none;font-size:24px;line-height:1;color:var(--text-3);
  cursor:pointer;padding:0 4px;
}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 22px 24px}

/* ===== 任务选择（九宫格） ===== */
.task-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.task-picker{grid-template-columns:repeat(2,1fr)}}
.task-pick{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;
  transition:.15s;background:#fff;
}
.task-pick:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.task-pick.locked{opacity:.55;cursor:not-allowed;background:#fafbfc}
.task-pick.locked:hover{border-color:var(--border);box-shadow:none}
.task-pick.ready{border-color:var(--teal);background:var(--teal-light)}
.task-pick-top{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.task-pick-ico{font-size:17px}
.task-pick-sub{font-size:11.5px;color:var(--text-3);margin-top:3px}
.task-pick-flag{font-size:11px;margin-top:6px;color:var(--teal);font-weight:600}

/* ===== 四步框架 ===== */
.step-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.step-flow{grid-template-columns:repeat(2,1fr)}}
.step-card{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;background:#fff;position:relative;
}
.step-no{
  width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-weight:600;
}
.step-name{font-size:13.5px;font-weight:600}
.step-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.step-desc{font-size:12px;color:var(--text-2);line-height:1.55}

/* ===== LSC 三维 ===== */
.dim-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:#fff}
.dim-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dim-ico{font-size:18px}
.dim-name{font-size:14px;font-weight:600}
.dim-en{font-size:11.5px;color:var(--text-3)}
.dim-desc{font-size:12.5px;color:var(--text-2);line-height:1.6}
.dim-score{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}

/* ===== 工具箱 ===== */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:900px){.tool-grid{grid-template-columns:1fr}}
.tool-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.15s;
}
.tool-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary)}
.tool-ico{
  width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--primary-light);
}
.tool-name{font-size:15px;font-weight:600}
.tool-desc{font-size:12.5px;color:var(--text-2);line-height:1.6;flex:1}
.tool-meta{font-size:11.5px;color:var(--text-3)}

/* ===== 抽签台：全屏深色 + 信封（上 2 下 3） ===== */
.dark-page[data-theme="lottery"]{
  background:radial-gradient(120% 120% at 50% 34%,#1e3a63 0%,#122440 46%,#070f1c 100%);
}
.lt-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 24px 44px;box-sizing:border-box}
.lt-topbar{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.lt-icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.07);color:#dbe7f6;font-size:18px;line-height:1;cursor:pointer;
}
.lt-icon-btn:hover{background:rgba(255,255,255,.16)}
.lt-fs-btn{
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#e4eefb;
  padding:10px 22px;border-radius:24px;font-size:22px;font-weight:600;cursor:pointer;
}
.lt-fs-btn:hover{background:rgba(255,255,255,.16)}
.lt-head{text-align:center;margin:4px 0 30px}
.lt-title{font-size:46px;font-weight:800;color:#fff;letter-spacing:4px;line-height:1.2}
.lt-sub{font-size:24px;color:#a9c2e0;letter-spacing:3px;margin-top:12px}
.lt-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;width:100%;flex:1}
.lt-row{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.lt-actions{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:38px}
.lt-btn{
  border:none;border-radius:34px;padding:16px 44px;font-size:24px;font-weight:700;letter-spacing:1.5px;
  cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s;
}
.lt-btn-primary{background:linear-gradient(180deg,#4269d6,#2a4fbb);color:#fff;box-shadow:0 10px 26px rgba(46,88,196,.45)}
.lt-btn-primary:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(46,88,196,.58)}
.lt-btn-ghost{background:rgba(255,255,255,.10);color:#cfdcec;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.lt-btn-ghost:hover{background:rgba(255,255,255,.20)}

/* 信封卡（横向宽卡） */
.env-card{
  position:relative;width:300px;height:196px;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#f0e7d4,#e4d9c0);
  box-shadow:0 16px 34px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.45);
  display:flex;align-items:flex-end;justify-content:center;padding:0 16px 30px;
  transition:transform .18s,box-shadow .18s;
}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:92px;
  background:linear-gradient(180deg,#f3ecdc,#ded1b4);
  clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 3px 5px rgba(120,100,70,.20));
}
.env-seal{
  position:absolute;top:34px;left:50%;transform:translateX(-50%);
  width:20px;height:20px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 32%,#f7f2e5,#bdb094);
  box-shadow:0 2px 4px rgba(90,72,45,.35);
}
.env-inner{position:relative;z-index:2;width:100%;text-align:center}
.env-gname{font-size:28px;font-weight:800;color:#5a4a31;letter-spacing:1.5px;line-height:1.25}
.env-gsub{font-size:22px;color:#8b7a5c;margin-top:6px}
.env-gsub.roll{font-size:24px;font-weight:700;color:#b8791b}
.env-card.rolling{animation:envpulse .5s ease-in-out infinite}
@keyframes envpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media(max-width:1040px){
  .env-card{width:262px;height:176px;padding-bottom:26px}
  .env-flap{height:82px}
  .lt-title{font-size:38px}
}

/* 已抽中：翻出任务信息 */
.env-card.drawn{display:block;height:auto;min-height:196px;padding:0 0 16px}
.env-card.drawn .env-flap{position:relative;height:42px;clip-path:none;box-shadow:none;filter:none;
  background:linear-gradient(180deg,#e0d3b5,#d2c3a0)}
.env-card.drawn .env-seal{display:none}
.env-card.drawn .env-inner{padding:12px 16px 0}
.env-card.drawn .env-gname{font-size:24px}
.env-lv{margin:5px 0 3px}
.env-lv .card-chip{font-size:22px;padding:2px 14px;border-radius:9px;margin:0}
.env-title{font-size:22px;font-weight:700;color:#4a3c26;line-height:1.35;margin-top:5px}
.env-client{font-size:22px;color:#6b5b40;line-height:1.4;margin-top:8px}

/* ===== 通用小标签 ===== */
.card-chip{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;margin-bottom:6px;
}
.chip-easy{background:var(--green-light);color:var(--green)}
.chip-std{background:var(--primary-light);color:var(--primary)}
.chip-hard{background:var(--amber-light);color:var(--amber)}
.chip-plus{background:var(--purple-light);color:var(--purple)}

/* ===== 抽签结果：选组 + 结果卡（深色投屏版面） ===== */
.rr-groups{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:2px 0 24px}
.rr-group{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:152px;padding:14px 22px;border-radius:16px;cursor:pointer;font-family:inherit;
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#cfdcec;
  transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;
}
.rr-group:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.rr-group.on{background:linear-gradient(180deg,#4269d6,#2a4fbb);border-color:#7d9bf0;box-shadow:0 10px 26px rgba(46,88,196,.5);color:#fff}
.rr-group-no{font-size:22px;font-weight:800;letter-spacing:1.5px}
.rr-group-state{font-size:15px;opacity:.85}
.rr-stage{width:100%;display:flex;justify-content:center;align-items:flex-start;flex:1}
.rr-empty{

.rr-card{

.rr-g{font-size:30px;font-weight:800;color:#fff;letter-spacing:2px}
.rr-lv{font-size:17px;padding:3px 14px;border-radius:9px;font-weight:700}
.rr-title{font-size:30px;font-weight:800;color:#f2f7ff;line-height:1.35;letter-spacing:.5px}
.rr-art{border-radius:16px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);line-height:0}

.rr-tag{

}
.rr-meta{display:flex;flex-direction:column;gap:10px;border-top:1px dashed rgba(255,255,255,.20);padding-top:16px}
.rr-mrow{display:flex;gap:14px;font-size:19px;line-height:1.6;color:#cfe0f4}

@media(max-width:1040px){

}

/* ===== 学生端问卷：已提交态 ===== */
.qa-done{padding:38px 16px 44px;text-align:center}
.qa-done-ico{
  width:66px;height:66px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(135deg,#2f9e44,#57c274);color:#fff;font-size:34px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(47,158,68,.32);
}
.qa-done-t{font-size:19px;font-weight:800;color:var(--text);margin-bottom:6px}
.qa-done-s{font-size:13px;color:var(--text-3);line-height:1.7}

/* ===== 二维码 ===== */
.qr-box{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.qr-canvas-wrap{
  border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:#fff;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.qr-canvas-wrap canvas,.qr-canvas-wrap img{display:block}
.qr-tip{font-size:11.5px;color:var(--text-3)}
.qr-info{flex:1;min-width:260px}
.url-input{
  width:100%;padding:9px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);
  margin:8px 0;font-size:13px;
}
.phone-frame{
  border:10px solid #1f2937;border-radius:26px;width:330px;background:#fff;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.phone-bar{background:#1f2937;color:#fff;font-size:11.5px;padding:6px 12px;display:flex;justify-content:space-between}
.phone-body{max-height:460px;overflow-y:auto;padding:14px}

/* ===== 互评问卷 ===== */
.qa-dim{margin-bottom:16px}
.qa-dim-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.qa-item{
  display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;background:#fff;
}
.qa-item:hover{border-color:var(--primary)}
.qa-item.checked{border-color:var(--teal);background:var(--teal-light)}
.qa-item input{margin-top:3px;width:15px;height:15px;accent-color:var(--teal)}
.qa-item-text{font-size:12.5px;line-height:1.55}
.qa-item-votes{font-size:11px;color:var(--text-3);margin-top:2px}
.qa-comment{width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:12.5px;resize:vertical;min-height:52px}

/* ===== 录音台：双人角色扮演录音台（深色投屏版面） ===== */
.modal.modal-rec{max-width:1180px}
.modal.modal-rec .modal-body{padding:0;border-radius:0 0 14px 14px;overflow-y:auto}
.rec-screen{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5.6vmin 3vmin 3vmin;
  background:linear-gradient(135deg,#0c1a3a 0%,#14235a 45%,#2a1b52 100%);
  color:#fff;text-align:center;
}
.rec-topbar{position:absolute;top:2.4vmin;left:3.2vmin;display:flex;align-items:center;gap:1.4vmin;font-weight:700;letter-spacing:.04em}
.rec-timer{font-size:2.8vmin;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#fff}
.rec-screen .rec-dot{width:2.2vmin;height:2.2vmin;min-width:14px;min-height:14px;border-radius:50%;background:#ff2d55;box-shadow:0 0 1.2vmin rgba(255,45,85,.9);display:inline-block;margin:0}
.rec-screen .rec-dot.recording{animation:recpulse .85s infinite}
@keyframes recpulse{
  0%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,45,85,.75)}
  50%{opacity:.18;transform:scale(.66);box-shadow:0 0 1.8vmin .7vmin rgba(255,45,85,0)}
  100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,45,85,0)}
}
.rec-title-wrap{text-align:center}
.rec-title{font-size:6.2vmin;font-weight:800;line-height:1.15;margin:0 0 1.2vmin;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.rec-theme{font-size:4vmin;font-weight:700;color:#fff;margin:0 0 1.2vmin;letter-spacing:.02em;line-height:1.4;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.rec-subtitle{font-size:2.2vmin;color:rgba(255,255,255,.72);font-weight:500;margin:0}
.rec-stage{display:flex;align-items:center;justify-content:center;gap:4vmin;width:100%;padding:2.6vmin 0}
.role-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;user-select:none}
.role-avatar{width:21vmin;height:26vmin;min-width:132px;min-height:166px;border-radius:2.2vmin;overflow:hidden;background:transparent;display:flex;align-items:center;justify-content:center;margin-bottom:1.2vmin}
.avatar-svg{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.role-name{font-size:2.6vmin;font-weight:700;color:#fff;margin-bottom:.6vmin}
.waveform-wrap{flex:1;display:flex;align-items:center;justify-content:center;height:30vmin;min-height:170px;max-width:52%;padding:0 1vmin}
.wave-canvas{width:100%;height:100%;display:block}
.rec-controls{display:flex;flex-direction:column;align-items:center;gap:1.8vmin;margin-top:1.4vmin}
.rec-buttons{display:flex;align-items:center;justify-content:center;gap:3vmin;flex-wrap:wrap}
.btn-record{display:inline-flex;align-items:center;justify-content:center;gap:1.2vmin;min-width:30vmin;padding:2vmin 4.4vmin;border:none;border-radius:999px;font-size:2.4vmin;font-weight:700;color:#fff;background:linear-gradient(90deg,#3b82f6 0%,#7c3aed 100%);box-shadow:0 1vmin 3vmin rgba(59,130,246,.35);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.btn-record svg{width:2.2vmin;height:2.2vmin;flex-shrink:0}
.btn-record:hover{transform:translateY(-.25vmin);box-shadow:0 1.2vmin 3.6vmin rgba(59,130,246,.42)}
.btn-record:active{transform:translateY(0)}
.btn-record.stop{background:linear-gradient(90deg,#ef4444 0%,#db2777 100%);box-shadow:0 1vmin 3vmin rgba(239,68,68,.35)}
.btn-group{display:inline-flex;align-items:center;justify-content:center;gap:1.2vmin;min-width:24vmin;padding:2vmin 3.4vmin;border:1px solid rgba(255,255,255,.32);border-radius:999px;font-size:2.4vmin;font-weight:700;color:#fff;background:rgba(255,255,255,.08);cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn-group svg{width:2.4vmin;height:2.4vmin;flex-shrink:0}
.btn-group:hover{background:rgba(255,255,255,.16);transform:translateY(-.25vmin)}
.btn-group .caret{transition:transform .2s ease}
.group-select{position:relative}
.group-select.open .btn-group .caret{transform:rotate(180deg)}
.group-dropdown{position:absolute;bottom:calc(100% + 1.5vmin);left:50%;transform:translateX(-50%) translateY(1.4vmin);width:26vmin;min-width:200px;background:rgba(10,22,48,.98);border:1px solid rgba(255,255,255,.18);border-radius:2vmin;box-shadow:0 2vmin 6vmin rgba(0,0,0,.55);padding:1vmin;display:none;flex-direction:column;gap:.6vmin;z-index:50}
.group-select.open .group-dropdown{display:flex;transform:translateX(-50%) translateY(0)}
.group-option{display:flex;align-items:center;gap:1.4vmin;width:100%;padding:1.5vmin 1.8vmin;border:none;border-radius:1.2vmin;background:transparent;color:#fff;font-size:2.2vmin;font-weight:700;text-align:left;cursor:pointer;transition:background .15s ease}
.group-option:hover{background:rgba(59,130,246,.22)}
.group-option.selected{background:rgba(124,58,237,.30)}
.group-option .opt-dot{width:1.8vmin;height:1.8vmin;min-width:12px;min-height:12px;border-radius:50%;background:#3b82f6;flex-shrink:0}
.group-option.selected .opt-dot{background:#a855f7}
.rec-hint{font-size:1.9vmin;color:rgba(255,255,255,.62);font-weight:500;margin:0}
.rec-extra{display:flex;align-items:center;justify-content:center;gap:1.4vmin;flex-wrap:wrap}
.rec-ghost{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#cfe0f4;padding:.9vmin 2vmin;border-radius:999px;font-size:1.6vmin;font-weight:600;cursor:pointer;font-family:inherit}
.rec-ghost:hover{background:rgba(255,255,255,.16)}
.rec-below{padding:18px 22px 24px}

/* ===== 录音台：全屏 / 还原按钮 ===== */
.rec-fs-btn{
  position:absolute;top:2.4vmin;right:3.2vmin;z-index:20;
  display:inline-flex;align-items:center;gap:.6vmin;
  padding:1.1vmin 2vmin;border:none;border-radius:999px;
  font-size:2vmin;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.16);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:background .15s ease,transform .15s ease;
}
.rec-fs-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-.2vmin)}
.rec-fs-btn svg{width:2.2vmin;height:2.2vmin}
.modal.rec-fullscreen{
  position:fixed;inset:0;width:100vw;height:100vh;max-width:none;border-radius:0;box-shadow:none;animation:none;
  display:flex;flex-direction:column;
}
.modal.rec-fullscreen .modal-body{height:100%;overflow-y:auto}
.modal.rec-fullscreen .rec-screen{min-height:100%;height:100%}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.scaffold-acc{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.scaffold-head{
  padding:9px 12px;background:#f7f9fc;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.scaffold-body{padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--text-2);background:#fff;border-top:1px solid var(--border)}
.scaffold-body .en{color:var(--primary);display:block;margin-bottom:3px}
.scaffold-body .cn{color:var(--text-3);font-size:11.5px}

/* ===== 质检报告 ===== */
.rp-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px}
.rp-score-big{font-size:34px;font-weight:700;color:var(--teal);line-height:1}
.rp-sec{margin-bottom:18px}
.rp-sec-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.rp-list{list-style:none}
.rp-list li{
  padding:9px 12px;border-left:3px solid var(--primary);background:#f7f9fc;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:8px;font-size:12.5px;line-height:1.65;
}
.rp-list.warn li{border-left-color:var(--amber);background:var(--amber-light)}
.rp-list.ok li{border-left-color:var(--green);background:var(--green-light)}
.rp-en{display:block;color:var(--text);margin-bottom:3px}
.rp-note{display:block;color:var(--text-2);font-size:11.5px}
.rp-dim-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rp-dim-name{width:110px;font-size:13px;font-weight:600;flex:0 0 110px}
.rp-dim-track{flex:1;height:10px;background:#eef1f5;border-radius:6px;overflow:hidden}
.rp-dim-fill{height:100%;border-radius:6px}
.rp-dim-val{width:44px;text-align:right;font-size:13px;font-weight:600}
.quote-en{
  background:#fff;border:1px dashed var(--border-2);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:12.5px;color:var(--primary);margin-bottom:6px;
}

/* ===== 学情图表 ===== */
.chart-box{height:300px;position:relative}
.chart-box.tall{height:380px}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}

.weak-item{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;background:#fff;
}
.weak-rank{
  width:22px;height:22px;border-radius:50%;background:var(--danger-light);color:var(--danger);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 22px;
}
.student-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.student-chip{
  padding:6px 12px;border:1px solid var(--border);border-radius:18px;cursor:pointer;font-size:12.5px;background:#fff;
}
.student-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.print-only{display:none}
@media print{
  .sidebar,.page-header .header-actions,.modal-header__actions{display:none}
  .main-content{margin-left:0}
  .print-only{display:block}
}

/* =========================================================
   改版 A：课堂互动工具箱 · 卡片墙
   ========================================================= */
.tool-wall{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1100px){.tool-wall{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.tool-wall{grid-template-columns:repeat(2,1fr)}}
.wall-card{
  background:var(--card);border:2px solid transparent;border-radius:var(--radius);
  padding:20px;cursor:pointer;text-align:center;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;transition:.18s;
}
.wall-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.wall-ico{font-size:40px;line-height:1.35;margin-bottom:12px}
.wall-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:4px}
.wall-sub{font-size:12px;color:var(--text-3);line-height:1.35}
.wall-flag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--primary-light);color:var(--primary)}
.hint-bar{
  margin-top:24px;background:#e9eef4;border-radius:var(--radius);
  padding:20px;font-size:14px;color:var(--text-3);line-height:1.3;text-align:center;
}
.hint-bar b{color:var(--primary)}

/* =========================================================
   改版 B：学情数据中心 · 入口页
   ========================================================= */
.dc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media(max-width:900px){.dc-grid{grid-template-columns:repeat(2,1fr)}}
.dc-task{
  border:1px solid var(--border);border-top:3px solid var(--border);border-radius:var(--radius);
  background:#fff;padding:16px 12px;text-align:center;cursor:pointer;transition:.18s;
}
.dc-task:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.dc-task.locked{opacity:.6}
.dc-ico{font-size:26px}
.dc-tk{font-size:11.5px;color:var(--text-3);letter-spacing:.5px;margin-top:3px}
.dc-name{font-size:14px;font-weight:600;margin-top:2px}
.dc-flag{font-size:11px;margin-top:6px;color:var(--text-3)}
.dc-task.ready .dc-flag{color:var(--green)}
.dc-wide-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
@media(max-width:820px){.dc-wide-grid{grid-template-columns:1fr}}
.dc-wide{
  display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;background:#fff;cursor:pointer;transition:.18s;
}
.dc-wide:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.dc-wide-ico{
  width:44px;height:44px;border-radius:12px;background:var(--primary-light);display:flex;
  align-items:center;justify-content:center;font-size:22px;flex:0 0 44px;
}
.dc-wide-title{font-size:14px;font-weight:600}
.dc-wide-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.dc-wide-go{margin-left:auto;font-size:12.5px;color:var(--primary)}

/* =========================================================
   改版 C：深色评价表页 + 学情诊断层
   ========================================================= */
.dark-page{position:fixed;inset:0;z-index:2000;display:none;background:#0b1a2e;overflow-y:auto}
.dark-page.show{display:block}
.dp-wrap{max-width:1080px;margin:0 auto;padding:22px 24px 44px}
.dp-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.dp-btn{
  border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.08);color:#e8eef7;
  padding:9px 16px;border-radius:22px;font-size:13px;cursor:pointer;
}
.dp-btn:hover{background:rgba(255,255,255,.16)}
.dp-btn.accent{background:#e8890c;border-color:#e8890c;color:#fff;font-weight:600}
.dp-btn.x{width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;line-height:1}
.dp-card{background:#12263e;border:1px solid #1d3a5c;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.dp-hero{position:relative;overflow:hidden}
.dp-hero-bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:#e8890c}
.dp-hero-body{display:flex;align-items:center;gap:16px;padding-left:10px}
.dp-hero-ico{
  width:64px;height:64px;border-radius:18px;background:rgba(232,137,12,.16);display:flex;
  align-items:center;justify-content:center;font-size:32px;flex:0 0 64px;
}
.dp-hero-title{font-size:19px;font-weight:600;color:#fff}
.dp-hero-en{font-size:12.5px;color:#8aa4c2;margin-top:3px;letter-spacing:.3px}
.dp-hero-sub{font-size:13px;color:#c3d3e6;margin-top:2px}
.dp-pill{
  display:inline-block;margin-top:8px;padding:5px 12px;border-radius:16px;font-size:12px;
  background:rgba(47,158,68,.16);color:#6fd08a;border:1px solid rgba(47,158,68,.35);
}
.dg-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dg-no{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:#fff;flex:0 0 30px;
}
.dg-ico{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:19px;flex:0 0 38px;
}
.dg-en{font-size:14.5px;font-weight:600;color:#fff;line-height:1.35}
.dg-cn{font-size:12px;margin-top:2px}
.dg-items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:760px){.dg-items{grid-template-columns:1fr}}
.metric-card{
  display:flex;gap:12px;align-items:center;background:#0f2035;border:1px solid #1b3550;
  border-radius:12px;padding:14px;
}
.mc-no{

.mc-fill{height:100%;border-radius:5px}
.mc-right{text-align:right;flex:0 0 86px}
.mc-num{font-size:14px;font-weight:600;color:#c3d3e6}

.mc-pct{font-size:11.5px;color:#8aa4c2;margin-top:2px}
.dp-tip{

.an-wrap{max-width:1000px;margin:0 auto;padding:22px 24px 44px}
.an-title{font-size:17px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.an-sec-head{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:#fff;margin-bottom:16px;flex-wrap:wrap}
.an-sec-no{

.an-mini:hover{color:#fff;border-color:#3d6da5}

.an-bar-val{font-size:12px;font-weight:600;color:#fff}
.an-axis{display:flex;justify-content:space-between;font-size:11px;color:#6f88a6;border-top:1px solid #1d3a5c;padding-top:6px;margin-top:6px}

.tm-display{

}

.tm-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.qz-en{font-size:19px;color:var(--primary);font-weight:600;margin-bottom:12px}
.qz-opt{

  cursor:pointer;font-size:13px;background:#fff;
}
.qz-opt:hover{border-color:var(--primary)}
.qz-opt.right{background:var(--green-light);border-color:var(--green);color:var(--green);font-weight:600}
.qz-opt.wrong{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}
.qz-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:10px}

.pz-chip{

.dlg-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}

.dlg-bubble{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;background:#fff;flex:1;line-height:1.6}

  <script>
/* =========================================================
   Task 2 检前告知工作站 — 主程序
   ========================================================= */
(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---------- 基础交互 ---------- */
  function showToast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("#toast-wrap").appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
  window.showToast = showToast;

  function openModal(title, html, size) {
    $("#modal-title").textContent = title;
    $("#modal-body").innerHTML = html;
    const m = $("#modal");
    m.className = "modal" + (size ? " modal-" + size : "");
    $("#modal-overlay").classList.add("show");
  }
  window.openModal = openModal;

  function closeModal() {
    $("#modal-overlay").classList.remove("show");
    if (recState.stream) stopAllTracks();
    const charts = document.querySelectorAll("#modal-body canvas");
    charts.forEach(() => {});
  }
  window.closeModal = closeModal;

  /* ---------- 导航 ---------- */
  const NAV = [
    { key: "overview", icon: "📊", name: "课程总览", sub: "", badge: "" },
    { key: "tasks", icon: "📋", name: "任务发布中心", sub: "9 个任务", badge: "" },
    { key: "review", icon: "✍️", name: "作业批阅&AI评价", sub: "角色扮演录音批阅", badge: "18" },
    { key: "data", icon: "📈", name: "学情数据中心", sub: "互评投票 + 学情分析", badge: "" },
    { key: "resources", icon: "📚", name: "课程资源素材库", sub: "6 类资源", badge: "" },
    { key: "grades", icon: "🎓", name: "成绩综合管理", sub: "过程性 + 增值性", badge: "" },
    { key: "toolkit", icon: "🧰", name: "课堂互动工具箱", sub: "抽签 / 二维码 / 录音 / 质检", badge: "" }
  ];

  let currentPage = "overview";

  function renderNav() {
    $("#sidebar-nav").innerHTML = NAV.map((n) => `
      <div class="nav-item ${n.key === currentPage ? "active" : ""}" onclick="navigateTo('${n.key}')">
        <span class="nav-ico">${n.icon}</span>
        <span>${n.name}</span>
        ${n.badge ? `<span class="nav-badge">${n.badge}</span>` : ""}
      </div>`).join("");
  }

  function navigateTo(key) {
    currentPage = key;
    renderNav();
    const nav = NAV.find((n) => n.key === key);
    $("#page-title").textContent = nav.name;
    $("#page-sub").textContent = nav.sub || "";
    destroyCharts();
    $("#page-content").innerHTML = PAGES[key] ? PAGES[key]() : "";
    if (PAGES_AFTER[key]) PAGES_AFTER[key]();
    window.scrollTo(0, 0);
  }
  window.navigateTo = navigateTo;

  /* ---------- 图表管理 ---------- */
  const charts = {};
  function destroyCharts() {
    Object.keys(charts).forEach((k) => { try { charts[k].destroy(); } catch (e) {} delete charts[k]; });
  }
  function drawChart(id, config) {
    const el = document.getElementById(id);
    if (!el || typeof Chart === "undefined") return;
    if (charts[id]) { try { charts[id].destroy(); } catch (e) {} }
    charts[id] = new Chart(el, config);
  }

  /* ---------- 互评投票数据（示例 + 实时新增） ---------- */
  const VOTES = {};
  PEER_CHECKLIST.forEach((d) => d.items.forEach((it) => { VOTES[it.id] = it.votes; }));
  let extraSubmitted = 0;
  try {
    const saved = JSON.parse(localStorage.getItem("task4_votes") || "null");
    if (saved && saved.votes) {
      Object.keys(saved.votes).forEach((k) => { if (VOTES[k] != null) VOTES[k] = saved.votes[k]; });
      extraSubmitted = saved.extra || 0;
    }
  } catch (e) {}
  function persistVotes() {
    try { localStorage.setItem("task4_votes", JSON.stringify({ votes: VOTES, extra: extraSubmitted })); } catch (e) {}
  }
  function resetVotes() {
    PEER_CHECKLIST.forEach((d) => d.items.forEach((it) => { VOTES[it.id] = it.votes; }));
    extraSubmitted = 0;
    persistVotes();
    showToast("已重置");
    navigateTo("data");
  }
  window.resetVotes = resetVotes;

  /* =========================================================
     页面 1：课程总览
     ========================================================= */
  const PAGES = {};
  const PAGES_AFTER = {};

  PAGES.overview = function () {
    const banner = OVERVIEW_BANNER;
    const statCard = (s) => `
      <div class="ov-stat" style="border-left-color:${s.ac}">
        <div class="ov-stat-label">${esc(s.label)}</div>
        <div class="ov-stat-value">${s.value}<span>${esc(s.unit)}</span></div>
        <div class="ov-stat-hint">${esc(s.hint)}</div>
      </div>`;
    const taskCard = (t) => {
      const p = BOARD_PROGRESS.find((x) => x.id === t.id) || { submitted: 0, pending: BOARD_TOTAL };
      const pct = Math.round((p.submitted / BOARD_TOTAL) * 100);
      return `
      <div class="ov-task" style="border-top-color:${t.bc}" onclick="openTaskDetail(${t.id})">
        <div class="ov-task-num" style="color:${t.bc}">${t.id}</div>
        <div class="ov-task-head"><span class="ov-task-ico">${t.icon}</span><span class="ov-task-name">${esc(t.name)}</span></div>
        <div class="ov-task-pill">${esc(t.out)}</div>
        <div class="ov-bar"><i style="width:${pct}%;background:${t.bc}"></i></div>
        <div class="ov-task-foot">
          <span class="ov-prog">📈 进度 ${pct}%</span>

  /* ---------- 深色全屏页：评价表 / 学情诊断 ---------- */
  function peerTotal() { return PEER_TOTAL + extraSubmitted; }

  function showDark(html, cls, theme) {
    const el = $("#dark-page");
    el.innerHTML = `<div class="${cls || "dp-wrap"}">${html}</div>`;
    if (theme) el.setAttribute("data-theme", theme);
    else el.removeAttribute("data-theme");
    el.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function hideDark() {
    destroyCharts();
    const el = $("#dark-page");
    el.classList.remove("show");
    el.removeAttribute("data-theme");
    el.innerHTML = "";
    document.body.style.overflow = "";
    const on = document.fullscreenElement || document.webkitFullscreenElement;
    if (on && (document.exitFullscreen || document.webkitExitFullscreen)) {
      try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
    }
  }
  window.hideDark = hideDark;

  function openEval(taskId) {
    evalTask = taskId;
    const t = TASKS.find((x) => x.id === taskId);
    if (!t || !t.ready) {
      showDark(`
        <div class="dp-topbar">
          <button class="dp-btn" onclick="hideDark()">← 返回主页</button>
          <span style="color:#8aa4c2;font-size:12.5px">学情数据中心 · 任务入口</span>

    const total = peerTotal();
    const groups = EVAL_GROUPS.map((g) => {
      const metrics = CORE_METRICS.filter((m) => m.dim === g.key);
      return `
        <div class="dp-card">
          <div class="dg-head">
            <div class="dg-no" style="background:${g.color}">${g.no}</div>
            <div class="dg-ico" style="background:${g.color}26">${g.icon}</div>
            <div>
              <div class="dg-en">${esc(g.en)}</div>
              <div class="dg-cn" style="color:${g.color}">${esc(g.cn)}</div>
            </div>
          </div>
          <div class="dg-items">
            ${metrics.map((m, i) => {
              const v = VOTES[m.id] || 0;
              const pct = v / total * 100;
              return `<div class="metric-card">
                <div class="mc-no" style="border-color:${g.color};color:${g.color}">${i + 1}</div>
                <div class="mc-body">
                  <div class="mc-en">${esc(m.en)}</div>
                  <div class="mc-cn">${esc(m.cn)}</div>
                  <div class="mc-bar"><div class="mc-fill" style="width:${pct.toFixed(1)}%;background:${g.color}"></div></div>

                  <div class="mc-num"><b style="color:${g.color}">${v}</b>/${total}</div>
                  <div class="mc-pct">达成率 ${pct.toFixed(1)}%</div>

              </div>`;
            }).join("")}
          </div>
        </div>`;
    }).join("");

    showDark(`
      <div class="dp-topbar">
        <button class="dp-btn" onclick="hideDark()">← 返回主页</button>
        <button class="dp-btn accent" onclick="openAnalysis()">📊 学情分析</button>
      </div>

      <div class="dp-card dp-hero">
        <div class="dp-hero-bar"></div>
        <div class="dp-hero-body">
          <div class="dp-hero-ico">🚶</div>

            <div class="dp-hero-title">Task 2 检前告知 · 角色扮演评价表</div>

            <div class="dp-hero-sub">学生互评表 —— 角色扮演</div>
            <div class="dp-pill">✅ 共 ${total} 名学生完成评价</div>

        </div>

        <button class="dp-btn" onclick="openVoteTable()">查看 8 项完整指标明细</button>
        <button class="dp-btn" onclick="resetVotes()">重置数据</button>
      </div>

        动线确认（point — walk — confirm）仅 <b style="color:#e8890c">15</b> 人识别到，
        岗位边界的委婉处理（先共情后设边界）仅 <b style="color:#e8890c">11</b> 人注意到，
        这两项是本课 AI 补盲与教师提炼的重点。
      </div>`);

  window.openEval = openEval;

  /* ---------- 学情可视化诊断（条形图 + 雷达图） ---------- */
  let radarMode = "core";

  function openAnalysis() {
    const total = peerTotal();
    const rows = CORE_METRICS.map((m) => {
      const v = VOTES[m.id] || 0;
      const pct = v / total * 100;
      return `<div class="an-bar-row">
        <div class="an-bar-label">
          <span class="an-bar-en" style="color:${m.color}">${esc(m.en)}</span>

        <div class="an-bar-track">
          <div class="an-bar-fill" style="width:${Math.max(pct, 8).toFixed(1)}%;background:${m.color}">
            <span class="an-bar-val">${pct.toFixed(1)}%</span>
          </div>
        </div>
      </div>`;
    }).join("");

    const order = CORE_METRICS.map((m, i) => `${i + 1}. ${esc(m.cn)}`).join(" · ");

    showDark(`
      <div class="dp-topbar">
        <div class="an-title">📊 Task 2 学情可视化诊断</div>

          <span class="an-sec-en">${radarMode === "core" ? "Capability Profile Radar (axis order identical to Chart 1)" : "Comprehensive CARE Radar (peer vs AI)"}</span>
          <button class="an-mini" onclick="toggleRadarMode()">辅助 / 综合图像</button>
        </div>
        <div class="an-radar"><canvas id="chartCoreRadar"></canvas></div>

          轴序与图 1 一致：${order}<br>
          ${radarMode === "core" ? "数据口径：勾选人数 ÷ 有效互评人数（" + total + " 人）。" : "数据口径：CARE 四维同伴互评均分 vs AI 质检均分（满分 100）。"}
        </div>
      </div>`, "an-wrap");

    drawCoreRadar(total);
  }
  window.openAnalysis = openAnalysis;

  function drawCoreRadar(total) {
    let config;
    if (radarMode === "core") {
      config = {
        labels: CORE_METRICS.map((m) => m.cn),
        datasets: [{
          label: "达成率 %",
          data: CORE_METRICS.map((m) => +((VOTES[m.id] || 0) / total * 100).toFixed(1)),
          borderColor: "#e8890c", backgroundColor: "rgba(232,137,12,.22)", borderWidth: 2,
          pointBackgroundColor: CORE_METRICS.map((m) => m.color), pointRadius: 4
        }]
      };
    } else {
      config = {
        labels: CARE_DIMS.map((d) => d.name + " " + d.en),
        datasets: [
          { label: "同伴互评", data: CARE_DIMS.map((d) => d.peer), borderColor: "#1668dc", backgroundColor: "rgba(22,104,220,.18)", pointBackgroundColor: "#1668dc" },
          { label: "AI 质检", data: CARE_DIMS.map((d) => d.ai), borderColor: "#e8890c", backgroundColor: "rgba(232,137,12,.18)", pointBackgroundColor: "#e8890c" }
        ]
      };
    }
    drawChart("chartCoreRadar", {
      type: "radar",
      data: config,
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: radarMode !== "core", labels: { color: "#c3d3e6", font: { size: 12 } } } },
        scales: {
          r: {
            beginAtZero: true, max: 100,
            ticks: { stepSize: 25, color: "#8aa4c2", backdropColor: "transparent", font: { size: 10 } },
            grid: { color: "#1d3a5c" }, angleLines: { color: "#1d3a5c" },
            pointLabels: { color: "#c3d3e6", font: { size: 12 } }
          }
        }
      }
    });
  }

  function toggleRadarMode() {
    radarMode = radarMode === "core" ? "dim" : "core";
    openAnalysis();
  }
  window.toggleRadarMode = toggleRadarMode;

  /* ---------- 两张综合分析卡 ---------- */

  function drawLottery() {
    const rest = LOTTERY_CARDS.filter((c) => c !== SCRIPT_CARD);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = rest[i]; rest[i] = rest[j]; rest[j] = tmp;
    }
    return [SCRIPT_CARD].concat(rest);

  /* ---------- 录音台：波形画布 ---------- */
  function recCanvasEl() { return document.getElementById("rec-wave-canvas"); }
  function recCtx2d() {
    const c = recCanvasEl();
    if (!c || typeof c.getContext !== "function") return null;
    try { return c.getContext("2d"); } catch (e) { return null; }
  }
  function recResizeCanvas() {
    const c = recCanvasEl(), x = recCtx2d();
    if (!c || !x) return;
    const r = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.floor((r.width || 1) * dpr));
    c.height = Math.max(1, Math.floor((r.height || 1) * dpr));
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function recDrawWave(getAmp) {
    const c = recCanvasEl(), x = recCtx2d();
    if (!c || !x) return;
    const r = c.getBoundingClientRect();
    const w = r.width, h = r.height;
    if (!w || !h) return;
    x.clearRect(0, 0, w, h);
    const mid = h / 2, slot = w / REC_BARS;
    const barW = Math.max(3, slot * 0.62);
    const grad = x.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0.00, "#ff3b3b");
    grad.addColorStop(0.16, "#ff9f40");
    grad.addColorStop(0.32, "#ffdd00");
    grad.addColorStop(0.47, "#4ade80");
    grad.addColorStop(0.62, "#22d3ee");
    grad.addColorStop(0.77, "#3b82f6");
    grad.addColorStop(0.90, "#a855f7");
    grad.addColorStop(1.00, "#c084fc");
    x.strokeStyle = grad;
    x.lineWidth = barW;
    x.lineCap = "round";
    x.lineJoin = "round";
    x.shadowColor = "rgba(255,255,255,0.18)";
    x.shadowBlur = 8;
    for (let i = 0; i < REC_BARS; i++) {
      const amp = getAmp(i, REC_BARS);
      const barH = Math.max(2, amp * (h / 2) * 0.92);
      const cx = i * slot + slot / 2;
      x.beginPath();
      x.moveTo(cx, mid - barH);
      x.lineTo(cx, mid + barH);
      x.stroke();
    }
    x.shadowBlur = 0;
    x.strokeStyle = "rgba(255,255,255,0.12)";
    x.lineWidth = 1;
    x.beginPath();
    x.moveTo(0, mid);
    x.lineTo(w, mid);
    x.stroke();
  }
  function recDrawStaticWave() {
    recDrawWave((i, n) => {
      const t = i / n;
      const env = Math.sin(t * Math.PI);
      const ripple = Math.abs(Math.sin(t * Math.PI * 5)) * 0.25 + 0.4;
      return Math.max(0.05, Math.min(1, 0.05 + env * 0.4 + ripple * env * 0.4));
    });
  }
  function recStartWave() {
    const tick = () => {
      if (!recState.on) return;
      if (recState.analyser && recState.data) {
        recState.analyser.getByteFrequencyData(recState.data);
        const step = Math.max(1, Math.floor(recState.data.length / REC_BARS));
        recDrawWave((i) => Math.max(0.05, Math.min(1, (recState.data[i * step] || 0) / 255)));
      } else {
        recState.t += 0.12;
        const t = recState.t;
        recDrawWave((i) => {
          const env = Math.sin(t * 0.7 + i * 0.12) * 0.5 + 0.5;
          const wv = Math.sin(t * 3 + i * 0.5) * 0.25 + 0.35;
          return Math.max(0.05, Math.min(1, env * 0.6 + wv + Math.random() * 0.2));
        });
      }
      recState.raf = requestAnimationFrame(tick);
    };
    tick();
  }
  function recOnResize() { recResizeCanvas(); if (!recState.on) recDrawStaticWave(); }
  function recInitWaveform() {
    recResizeCanvas();
    recDrawStaticWave();
    window.removeEventListener("resize", recOnResize);
    window.addEventListener("resize", recOnResize);
    setTimeout(() => { recResizeCanvas(); if (!recState.on) recDrawStaticWave(); }, 60);

  /* ---------- 录音台：录音控制 ---------- */
  function fmt(s) {
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function recSyncUI() {
    const btn = document.getElementById("rec-btn-record");
    const dot = document.getElementById("rec-dot");
    if (btn) {
      btn.classList.toggle("stop", recState.on);
      btn.innerHTML = recState.on
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>停止录音'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>开始录音';
    }
    if (dot) dot.classList.toggle("recording", recState.on);
  }

  function recToggleRecording() {
    if (recState.on) { recStopRecord(); return; }
    recStartRecord();
  }
  window.recToggleRecording = recToggleRecording;

  function recStartRecord() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast("当前环境不支持录音，请使用“演示模式”");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      recState.stream = stream;
      recState.chunks = [];
      if (typeof MediaRecorder !== "undefined") {
        try {
          recState.rec = new MediaRecorder(stream);
          recState.rec.ondataavailable = (e) => { if (e.data && e.data.size) recState.chunks.push(e.data); };
          recState.rec.onstop = () => {
            const blob = new Blob(recState.chunks, { type: "audio/webm" });
            if (recState.url) URL.revokeObjectURL(recState.url);
            recState.url = URL.createObjectURL(blob);
          };
          recState.rec.start();
        } catch (e) { recState.rec = null; }
      }
      recState.on = true;
      recState.sec = 0;
      recState.t = 0;
      const el = document.getElementById("rec-time");
      if (el) el.textContent = "00:00";
      recState.timer = setInterval(() => {
        recState.sec++;
        const t = document.getElementById("rec-time");
        if (t) t.textContent = fmt(recState.sec);
      }, 1000);
      try {
        recState.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = recState.ctx.createMediaStreamSource(stream);
        const an = recState.ctx.createAnalyser();
        an.fftSize = 128;
        src.connect(an);
        recState.analyser = an;
        recState.data = new Uint8Array(an.frequencyBinCount);
      } catch (e) { recState.analyser = null; recState.data = null; }
      recSyncUI();
      recStartWave();
    }).catch(() => {
      showToast("无法访问麦克风，请检查权限或使用“演示模式”");
    });
  }

  function stopAllTracks() {
    if (recState.stream) { recState.stream.getTracks().forEach((t) => t.stop()); recState.stream = null; }
    if (recState.timer) { clearInterval(recState.timer); recState.timer = null; }
    if (recState.raf) { cancelAnimationFrame(recState.raf); recState.raf = null; }
    recState.analyser = null;
    recState.data = null;
  }

  function recStopRecord() {
    if (recState.rec && recState.rec.state === "recording") { try { recState.rec.stop(); } catch (e) {} }
    stopAllTracks();
    recState.on = false;
    recSyncUI();
    recDrawStaticWave();
    if (recState.sec > 0) showToast("录音已完成 · 时长 " + fmt(recState.sec) + " · 可回放或提交 AI 分析");
  }

    timerState.id = setInterval(() => {

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
      o.start(); o.stop(ctx.currentTime + 1.2);
    } catch (e) {}
  }

  window.exportAll = function () { showToast("全套资料导出中…"); };

  function exportGrades() {
    const head = ["学号", "姓名", "小组", "角色", "准确L", "关怀S", "文化C", "总评", "增值"];
    const rows = SAMPLE_STUDENTS.map((s) => [s.id, s.name, s.group, s.role, s.L, s.S, s.C, s.task4, s.growth]);
    const csv = "\ufeff" + [head].concat(rows).map((r) => r.join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Task4_成绩单.csv";
    a.click();
    showToast("成绩单已导出");
  }
  window.exportGrades = exportGrades;

  /* ---------- 启动 ---------- */
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const dp = $("#dark-page");
    if (dp && dp.classList.contains("show")) { hideDark(); return; }
    closeModal();
  });

  navigateTo("overview");
})();

</script>
</body>
</html>
